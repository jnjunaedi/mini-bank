services:
  minibank-db:
    image: mysql:8.0
    container_name: minibank-mysql-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: minibank_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: always

  account-service:
    build:
      context: ./account-service
      dockerfile: Dockerfile
    container_name: account-microservice
    ports:
      - "8080:8080"
      - "50051:50051"
    environment:
      - DB_HOST=minibank-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=minibank_db
    depends_on:
      - minibank-db
    restart: always

  transaction-service:
    build:
      context: ./transaction-service
      dockerfile: Dockerfile
    container_name: transaction-microservice
    ports:
      - "8081:8081"
    environment:
      - DB_HOST=minibank-db
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=rootpassword
      - DB_NAME=minibank_db
      - ACCOUNT_SERVICE_HOST=account-service:50051
    depends_on:
      - minibank-db
      - account-service
    restart: always

volumes:
  mysql_data:
